name: Build VST3 Plugins

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: PitchShift_Windows_x64_VST3
          - name: macOS (Universal M1/M2/Intel)
            os: macos-latest
            artifact_name: PitchShift_macOS_Universal_VST3
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: PitchShift_Linux_x64_VST3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev             ladspa-sdk libfreetype6-dev             libx11-dev libxcomposite-dev libxcursor-dev             libxext-dev libxinerama-dev libxrandr-dev libxrender-dev             mesa-common-dev libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 plugin
        run: cmake --build build --config Release --parallel

      - name: Upload Compiled VST3 Plugin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/**/*.vst3
            build/**/VST3
          if-no-files-found: warn
